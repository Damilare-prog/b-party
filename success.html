<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>You're In — 🅱️ PARTY</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head><body><main style="max-width:900px;margin:60px auto;padding:24px"><p class="eyebrow">PAYMENT STATUS</p><h1>YOU'RE <span>IN.</span> 🅱️</h1><p id="status">Confirming your payment and preparing your ticket…</p><div id="tickets"></div><a class="btn" href="index.html">BACK TO 🅱️ PARTY</a></main><script src="config.js"></script><script>
const API=(window.BPARTY_CONFIG?.API_BASE_URL||'').replace(/\/$/,''); const ref=new URLSearchParams(location.search).get('reference')||sessionStorage.getItem('bparty_pending_reference');
async function go(){if(!ref){document.getElementById('status').textContent='No payment reference found.';return;} try{const r=await fetch(`${API}/api/verify?reference=${encodeURIComponent(ref)}`);const d=await r.json();if(d.status!=='success'){document.getElementById('status').textContent='Payment is still being confirmed. Please refresh in a moment.';return;}document.getElementById('status').textContent='Payment confirmed. These are your tickets:';d.tickets.forEach((t,i)=>{const box=document.createElement('section');box.style.cssText='margin:24px 0;padding:24px;border:1px solid #333;border-radius:18px;background:#151515';box.innerHTML=`<h2>TICKET ${i+1}</h2><p><strong>${t.customer_name}</strong><br>${t.wave}<br>${t.ticket_code}</p><div id="qr${i}"></div><p style="opacity:.7">Keep this QR code for entrance.</p>`;document.getElementById('tickets').appendChild(box);new QRCode(document.getElementById('qr'+i),{text:t.ticket_code,width:180,height:180});});sessionStorage.removeItem('bparty_pending_reference');}catch(e){document.getElementById('status').textContent='We could not confirm the payment yet. Please refresh shortly.';}}go();
</script></body></html>
