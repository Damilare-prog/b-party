<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Influencer Dashboard — 🅱️ PARTY</title><link rel="stylesheet" href="styles.css"></head><body><main style="max-width:1100px;margin:50px auto;padding:24px"><p class="eyebrow">🅱️ PARTY / PARTNER</p><h1 id="name">INFLUENCER <span>DASHBOARD.</span></h1><div class="grid" style="margin:30px 0"><article class="card"><small>TICKETS SOLD</small><strong id="tickets">—</strong></article><article class="card"><small>REVENUE</small><strong id="revenue">—</strong></article><article class="card"><small>ORDERS</small><strong id="orders">—</strong></article></div><section class="card"><small>YOUR REFERRAL LINK</small><p id="link" style="word-break:break-all"></p><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('link').textContent);this.textContent='COPIED!'">COPY LINK</button></section><p style="margin-top:30px"><a href="index.html">← Back to website</a></p></main><script src="config.js"></script><script>const API=(window.BPARTY_CONFIG?.API_BASE_URL||'').replace(/\/$/,'');const ref=new URLSearchParams(location.search).get('ref');async function go(){if(!ref){document.getElementById('name').textContent='ADD YOUR REFERRAL CODE';return}const r=await fetch(`${API}/api/influencer?ref=${encodeURIComponent(ref)}`),d=await r.json();if(!r.ok){document.getElementById('name').textContent='INFLUENCER NOT FOUND';return}document.getElementById('name').innerHTML=`${d.influencer.name.toUpperCase()} <span>DASHBOARD.</span>`;document.getElementById('tickets').textContent=d.stats.tickets;document.getElementById('revenue').textContent=new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(d.stats.revenue/100);document.getElementById('orders').textContent=d.stats.orders;document.getElementById('link').textContent=`${location.origin}${location.pathname.replace('influencer.html','')}?ref=${d.influencer.slug}`}go();</script></body></html>
