<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🅱️ PARTY Admin</title><link rel="stylesheet" href="styles.css"></head><body><main style="max-width:1100px;margin:50px auto;padding:24px"><p class="eyebrow">🅱️ PARTY / ADMIN</p><h1>SALES <span>COMMAND.</span></h1><input id="token" placeholder="Admin token" style="padding:15px;width:100%;max-width:500px"><button class="btn" onclick="load()">LOAD DASHBOARD</button><div class="grid" style="margin:30px 0"><article class="card"><small>ORDERS</small><strong id="orders">—</strong></article><article class="card"><small>TICKETS</small><strong id="tickets">—</strong></article><article class="card"><small>REVENUE</small><strong id="revenue">—</strong></article></div><div class="card"><h2>INFLUENCERS</h2><div id="list"></div></div></main><script src="config.js"></script><script>async function load(){const t=document.getElementById('token').value;const r=await fetch((window.BPARTY_CONFIG.API_BASE_URL||'')+'/api/admin/stats',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok)return alert(d.error||'Unauthorized');document.getElementById('orders').textContent=d.totals.orders;document.getElementById('tickets').textContent=d.totals.tickets;document.getElementById('revenue').textContent=new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(d.totals.revenue/100);document.getElementById('list').innerHTML=d.influencers.map(i=>`<p><strong>${i.name}</strong> — ${i.tickets} tickets — ${new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(i.revenue/100)} — <code>${i.slug}</code></p>`).join('')}</script></body></html>
